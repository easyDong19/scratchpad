<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Scratchpad</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
    }
    #workspace {
      display: flex;
      width: 100%;
      height: 100vh;
    }
    #container {
      flex: 1;
      min-width: 0;
      height: 100%;
    }
    /* 메모 패널 (Ctrl+X 토글) */
    #resizer {
      width: 4px;
      cursor: col-resize;
      background: #2b2b2b;
      flex: 0 0 auto;
    }
    #resizer:hover, #resizer.dragging {
      background: #4a7fb5;
    }
    #memo {
      width: 380px;
      min-width: 160px;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      border-left: 1px solid #2b2b2b;
    }
    #memo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      color: #8a8a8a;
      font: 11px -apple-system, sans-serif;
      background: #232323;
      user-select: none;
    }
    #memo-head .hint {
      color: #5a5a5a;
    }
    #memo-editor {
      flex: 1;
      min-height: 0;
    }
    body.memo-closed #memo,
    body.memo-closed #resizer {
      display: none;
    }
    #statusbar {
      position: fixed;
      right: 12px;
      bottom: 8px;
      color: #6a6a6a;
      font: 11px -apple-system, sans-serif;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body class="memo-closed">
  <div id="workspace">
    <div id="container"></div>
    <div id="resizer"></div>
    <aside id="memo">
      <div id="memo-head"><span>메모 — 정답 보고 따라 치기</span><span class="hint">Ctrl+X</span></div>
      <div id="memo-editor"></div>
    </aside>
  </div>
  <div id="statusbar"></div>
  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
